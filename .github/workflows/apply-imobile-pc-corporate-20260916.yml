name: Apply corporate PC i-mobile
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_imobile_pc_corporate_20260916.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply corporate desktop-only i-mobile patch
        run: python scripts/apply_imobile_pc_corporate_20260916.py
      - name: Validate Python
        run: python -m py_compile services/corporate/main.py
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/corporate/main.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install corporate i-mobile PC ad on desktop'
          git push origin HEAD:main
