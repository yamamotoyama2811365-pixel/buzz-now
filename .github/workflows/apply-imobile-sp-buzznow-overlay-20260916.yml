name: Apply Buzz Now SP overlay i-mobile
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_imobile_sp_buzznow_overlay_20260916.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Buzz Now SP overlay
        run: python scripts/apply_imobile_sp_buzznow_overlay_20260916.py
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html templates/trend.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install Buzz Now SP 320x50 overlay i-mobile ad'
          git push origin HEAD:main
