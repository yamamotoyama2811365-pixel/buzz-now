name: BUZZ NOW social text-only switch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/buzz-top-seo-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Disable automatic social image generation and attachment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/main.py')
          s=p.read_text(encoding='utf-8')

          env_anchor='SOCIAL_AI_IMAGE_ENABLED = os.getenv("SOCIAL_AI_IMAGE_ENABLED", "false").lower() == "true"'
          if env_anchor not in s:
              raise SystemExit('SOCIAL_AI_IMAGE_ENABLED anchor not found')
          if 'SOCIAL_TEXT_ONLY = ' not in s:
              s=s.replace(env_anchor, env_anchor+'\nSOCIAL_TEXT_ONLY = os.getenv("SOCIAL_TEXT_ONLY", "true").lower() == "true"', 1)

          safe_anchor='''def _ensure_social_safe_card(c, row, ts: str):\n    \"\"\"Use a BUZZ NOW-owned data card instead of an AI context image when confidence is low.\"\"\"'''
          safe_new=safe_anchor+'\n    if SOCIAL_TEXT_ONLY:\n        return {"ok": False, "reason": "SOCIAL_TEXT_ONLY=true"}'
          if safe_anchor in s and 'def _ensure_social_safe_card' in s and safe_new not in s:
              s=s.replace(safe_anchor,safe_new,1)

          ai_anchor='''def _ensure_social_ai_image(c, row, ts: str):\n    \"\"\"Generate once and persist in PostgreSQL so Buffer can fetch a stable HTTPS URL.\"\"\"'''
          ai_new=ai_anchor+'\n    if SOCIAL_TEXT_ONLY:\n        return {"ok": False, "reason": "SOCIAL_TEXT_ONLY=true"}'
          if ai_anchor in s and ai_new not in s:
              s=s.replace(ai_anchor,ai_new,1)

          # Threads: keep post text but never attach an existing cached image in text-only mode.
          threads_call="response = _send_to_buffer_channel(channel_id, text, image_url, 'shareNow')"
          if threads_call in s and "if SOCIAL_TEXT_ONLY:\n            image_url = ''\n        response = _send_to_buffer_channel" not in s:
              s=s.replace(threads_call,"if SOCIAL_TEXT_ONLY:\n            image_url = ''\n        "+threads_call,1)

          # X: payload image_url should be ignored even if an older cached image exists.
          x_anchor='''            image_url = payload.get(\"image_url\", \"\") if payload.get(\"image_ready\") else \"\"\n            if image_url:\n                _prewarm_social_jpeg(row[\"id\"])'''
          x_new='''            image_url = \"\" if SOCIAL_TEXT_ONLY else (payload.get(\"image_url\", \"\") if payload.get(\"image_ready\") else \"\")\n            if image_url:\n                _prewarm_social_jpeg(row[\"id\"])'''
          if x_anchor in s:
              s=s.replace(x_anchor,x_new,1)

          # Diagnostics should report the real production mode.
          s=s.replace('"social_image_mode": "ai_context_visual",','"social_image_mode": "text_only" if SOCIAL_TEXT_ONLY else "ai_context_visual",')

          required=['SOCIAL_TEXT_ONLY = os.getenv("SOCIAL_TEXT_ONLY", "true")','SOCIAL_TEXT_ONLY=true','"social_image_mode": "text_only" if SOCIAL_TEXT_ONLY else "ai_context_visual"']
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'missing marker after patch: {needle}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate application syntax and text-only guards
        run: |
          python -m py_compile app/main.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app/main.py').read_text(encoding='utf-8')
          assert 'SOCIAL_TEXT_ONLY = os.getenv("SOCIAL_TEXT_ONLY", "true").lower() == "true"' in s
          assert s.count('return {"ok": False, "reason": "SOCIAL_TEXT_ONLY=true"}') >= 2
          assert 'image_url = "" if SOCIAL_TEXT_ONLY else' in s
          print('text-only social patch validated')
          PY
      - name: Commit social text-only mode
        run: |
          if git diff --quiet -- app/main.py; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          git commit -m 'Make BUZZ NOW social posts text only'
          git push origin HEAD:main
