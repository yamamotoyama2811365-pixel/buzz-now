name: BUZZ NOW outage SEO fix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/buzz-top-seo-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Strengthen DB-outage top page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/migration_control.py')
          s = p.read_text(encoding='utf-8')

          replacements = {
            'title = "Buzz Now｜いま話題の理由がわかるトレンド情報"':
              'title = "BUZZ NOW｜いま話題の理由・急上昇ワード・トレンド速報"',
            'description = "いま話題になっているキーワードを集め、なぜ今話題なのかを出典と時点付きで整理するBuzz Now。"':
              'description = "BUZZ NOWは、いま話題の人物・出来事・作品・企業や急上昇ワードを集め、なぜ今話題なのか、確認できた背景・出典・関連情報を整理するトレンド情報サイトです。"',
            'heading = "Buzz Now"':
              'heading = "BUZZ NOW｜いま話題の理由を追う"',
            'lead = "Buzz Nowは、検索やSNSで注目が集まり始めたキーワードについて、名前だけを並べるのではなく『なぜ今話題なのか』を確認できるよう整理するトレンド情報サイトです。"':
              'lead = "BUZZ NOWは、検索やSNSで注目が集まり始めた人物、出来事、作品、企業などのキーワードを追い、名前だけを並べるのではなく『なぜ今話題なのか』『何が起きたのか』『どの情報源で確認できるのか』まで短時間で把握できるよう整理するトレンド情報サイトです。"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'anchor not found: {old[:50]}')
              s = s.replace(old, new, 1)

          old_nav = '''        <nav class=\\"nav\\" aria-label=\\"サイトメニュー\\">\n          <a href=\\"/\\" aria-current=\\"page\\">Buzz Nowトップ</a>\n          <a href=\\"/corporate/\\">企業倒産・新規法人情報</a>\n        </nav>'''
          new_nav = '''        <nav class=\\"nav\\" aria-label=\\"サイトメニュー\\">\n          <a href=\\"/\\" aria-current=\\"page\\">BUZZ NOWトップ</a>\n          <a href=\\"#about\\">BUZZ NOWとは</a>\n          <a href=\\"#categories\\">話題のカテゴリ</a>\n          <a href=\\"#sources\\">情報源と確認方針</a>\n          <a href=\\"/corporate/\\">企業情報トップ</a>\n          <a href=\\"/corporate/bankruptcies\\">倒産速報</a>\n          <a href=\\"/corporate/registrations\\">新規法人</a>\n          <a href=\\"/corporate/signals\\">地域・業種の動き</a>\n        </nav>'''
          if old_nav not in s:
              raise SystemExit('non-corporate nav anchor not found')
          s = s.replace(old_nav, new_nav, 1)

          old_sections = '''        <section><h2>Buzz Nowが整理する情報</h2><p>話題のキーワード、注目が高まった背景、関連する出来事、確認できた情報源を分けて整理します。単にトレンド名を転載するのではなく、読者が「何が起きたのか」「なぜ今検索されているのか」を短時間で把握できるページを目指しています。</p></section>\n        <section><h2>情報の確認方針</h2><p>公開情報やニュースなど確認できる情報を基にし、確認できない内容を事実として補完しません。話題の理由は時点によって変わるため、更新時刻や出典を確認できる構成で通常ページを公開しています。</p></section>\n        <section><h2>現在の更新状況</h2><p>データベースの月間利用上限により、最新ランキングと個別トピックの読み込みを一時停止しています。この案内ページは検索エンジンがサイトの目的を理解できるよう維持し、データ接続が復旧し次第、通常のトレンド一覧に自動で戻ります。</p></section>'''
          new_sections = '''        <section id=\\"about\\"><h2>BUZZ NOWで分かること</h2><p>話題のキーワード、注目が高まった背景、関連する出来事、確認できた情報源を分けて整理します。単にトレンド名を転載するのではなく、読者が「何が起きたのか」「なぜ今検索されているのか」「その話題に新しい情報があるのか」を短時間で把握できるページを目指しています。</p></section>\n        <section><h2>急上昇とPre-Buzzの見方</h2><p>通常表示では、現在の注目度だけでなく、検索・閲覧データの変化から伸びる兆しが見えるキーワードも区別して掲載します。大きな数値だけを理由に断定せず、取得時点、更新時刻、関連情報を組み合わせて確認できる構成にしています。</p></section>\n        <section id=\\"categories\\"><h2>人物・ニュース・エンタメ・スポーツ・ビジネス</h2><p>芸能人やスポーツ選手の名前、ドラマや作品名、企業・サービス、社会ニュースなど、検索される理由が時間とともに変わる話題を横断して扱います。カテゴリは入口として使い、詳細ページではそのキーワード固有の背景を整理します。</p></section>\n        <section><h2>「なぜ今話題か」を重視</h2><p>BUZZ NOWの中心はランキング順位そのものではありません。検索した人が知りたいのは、その言葉が今なぜ急に注目されているのかです。そのため、通常のトピックページでは確認できたニュース、公式発表、公開データなどを基に背景を説明し、出典へ戻れるようにします。</p></section>\n        <section id=\\"sources\\"><h2>情報源と確認方針</h2><p>Google Trends、Wikimediaの公開データ、公式発表、公開ニュースなど、確認できる情報を基に整理します。取得できない内容や根拠を確認できない内容を事実として補完せず、未確認と確認済みを区別します。話題の理由は時点によって変わるため、更新時刻と出典も重要な情報として扱います。</p></section>\n        <section><h2>企業情報も別入口で確認</h2><p>同じサイト基盤では、企業倒産・新規法人情報も整理しています。<a href=\\"/corporate/bankruptcies\\">企業の倒産速報</a>、<a href=\\"/corporate/registrations\\">新規法人情報</a>、<a href=\\"/corporate/signals\\">地域・業種の動き</a>から目的別に確認できます。</p></section>\n        <section><h2>自動更新と品質管理</h2><p>通常運用ではデータ収集を自動化し、更新日時、取得元、重複、古い情報を区別します。取得処理が止まった場合に古い情報を新着として見せたり、データ欠損をゼロ件とみなしたりしないことを基本方針にしています。</p></section>\n        <section><h2>現在の更新状況</h2><p>現在はデータベースの転送量上限に達しているため、最新ランキングと一部の個別トピック読み込みを一時停止しています。サイトの目的、検索導線、既存URL、企業情報への入口は維持しています。データ接続が復旧し次第、通常のトレンドランキングと新着トピック表示へ戻ります。</p></section>'''
          if old_sections not in s:
              raise SystemExit('fallback section anchor not found')
          s = s.replace(old_sections, new_sections, 1)

          required = [
              'BUZZ NOW｜いま話題の理由・急上昇ワード・トレンド速報',
              'id=\\"categories\\"',
              '/corporate/bankruptcies',
              'データベースの転送量上限',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'missing after patch: {needle}')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate Python and fallback markers
        run: |
          python -m py_compile app/migration_control.py
          python - <<'PY'
          from app.migration_control import _fallback_html
          html=_fallback_html('/').decode('utf-8')
          assert 'BUZZ NOW｜いま話題の理由・急上昇ワード・トレンド速報' in html
          assert '/corporate/bankruptcies' in html
          assert 'なぜ今話題' in html
          assert 'データベースの転送量上限' in html
          print('fallback validation ok', len(html))
          PY
      - name: Commit outage-page SEO fix
        run: |
          if git diff --quiet -- app/migration_control.py; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/migration_control.py
          git commit -m 'Strengthen BUZZ NOW DB outage landing page'
          git push origin HEAD:main
