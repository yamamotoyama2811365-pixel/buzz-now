name: City corporate regional roundup tests
on:
  push:
    branches: [main]
    paths: [app/city_corporate_*.py, tests/test_city_corporate*.py, .github/workflows/citycorp-digest-tests.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi httpx
      - run: python -m unittest discover -s tests -p 'test_city_corporate*.py' -v
      - run: python -m py_compile app/main.py app/city_corporate_digest.py
