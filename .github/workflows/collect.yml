name: BUZZ NOW Auto Collect

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Wake BUZZ NOW
        run: |
          curl --fail --retry 3 --retry-delay 20 \
          --max-time 120 \
          "https://buzz-now.onrender.com/"

      - name: Collect trend data
        run: |
          curl --fail --retry 3 --retry-delay 20 \
          --max-time 180 \
          -X POST \
          "https://buzz-now.onrender.com/api/collect-now"

      - name: Check collectors
        run: |
          curl --fail --max-time 60 \
          "https://buzz-now.onrender.com/api/collector-debug"
