name: BUZZ NOW Auto Collect

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: buzz-now-auto-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger background collection
        run: |
          curl             --fail             --silent             --show-error             --connect-timeout 10             --max-time 20             "https://buzz-now-1.onrender.com/api/collect-now-browser"
