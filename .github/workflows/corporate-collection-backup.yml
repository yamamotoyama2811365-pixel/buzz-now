name: Corporate collection backup
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: corporate-collection-backup
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Verify corporate modules compile
        run: python -m compileall -q services/corporate scripts/run_corporate_backup.py
      - name: Collect bankruptcy and new-corporation facts
        run: python scripts/run_corporate_backup.py
