name: Corporate regional editorial
on:
  push:
    paths: ['services/corporate/**', 'tests/test_regional_editorial.py', '.github/workflows/corporate-regional-editorial.yml']
  pull_request:
    paths: ['services/corporate/**', 'tests/test_regional_editorial.py', '.github/workflows/corporate-regional-editorial.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_regional_editorial.py' -v
