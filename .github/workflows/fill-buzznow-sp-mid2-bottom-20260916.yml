name: Fill Buzz Now SP mid2 and bottom ads
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fill_buzznow_sp_mid2_bottom_20260916.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fill Buzz Now SP mid2 and bottom slots
        run: python scripts/fill_buzznow_sp_mid2_bottom_20260916.py
      - name: Commit placements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html templates/trend.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install Buzz Now SP mid2 and bottom i-mobile ads'
          git push origin HEAD:main
