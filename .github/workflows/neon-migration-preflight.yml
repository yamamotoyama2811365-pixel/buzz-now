name: Retention deployment read-only verification
on:
  push:
    branches: [ops/neon-migration-preflight]
    paths: [.github/workflows/neon-migration-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Neon readiness and homepage without running collectors
        shell: python
        run: |
          import json, time, urllib.request, urllib.parse
          base = "https://buzz-now-1.onrender.com"
          last = None
          for attempt in range(25):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=20) as r:
                      health = json.load(r)
                  if health.get("database_backend") != "neon" or health.get("migration_maintenance") is not False:
                      raise RuntimeError("Waiting for Neon application deployment")
                  with urllib.request.urlopen(base + "/ready", timeout=20) as r:
                      ready = json.load(r)
                  assert ready.get("ready") is True and ready.get("database") == "ok", ready
                  with urllib.request.urlopen(base + "/", timeout=20) as r:
                      body = r.read()
                      assert r.status == 200 and len(body) > 1000
                  with urllib.request.urlopen(base + "/api/trends?limit=1", timeout=20) as r:
                      slug = json.load(r)["items"][0]["slug"]
                  path = base + "/api/trends/" + urllib.parse.quote(slug, safe="") + "/traffic"
                  with urllib.request.urlopen(path + "?limit=100", timeout=20) as r:
                      detail = json.load(r)
                  assert len(detail["history"]) <= 100
                  with urllib.request.urlopen(path + "/daily?days=365", timeout=20) as r:
                      archive = json.load(r)
                  assert archive["kind"] == "forecast" and archive["days"] == 365
                  assert archive["items"] and archive["items"][0]["samples"] > 0
                  print("VERIFIED: Neon ready, homepage 200, recent history and daily forecast summary available.")
                  print(json.dumps(health))
                  print(json.dumps(ready))
                  break
              except Exception as exc:
                  last = str(exc)
                  print("Waiting for healthy deployment:", last)
                  time.sleep(15)
          else:
              raise RuntimeError(last)
# Migration writes were removed after successful final copy.
# Re-running this workflow performs public read-only HTTP checks only.
