name: Open Close Commercial Tenant SQL Fix
on:
  push:
    branches: [work/open-close-commercial-intel-20260916]
    paths:
      - scripts/fix_open_close_commercial_tenant_sql_20260916.py
      - .github/workflows/open-close-commercial-tenant-sql-fix-20260916.yml
permissions:
  contents: write
jobs:
  fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic tenant SQL fix
        run: python scripts/fix_open_close_commercial_tenant_sql_20260916.py
      - name: Syntax checks
        run: |
          python -m py_compile services/open_close/collectors/seo_pages.py
          python - <<'PY'
          src=open('services/open_close/collectors/seo_pages.py').read()
          assert 'tenant_city_filter = city_filter.replace("city", "s.city")' in src
          assert "COALESCE(s.status,'') <> 'excluded'" in src
          assert "COALESCE(NULLIF(s.address,''),'')<>''" in src
          assert 'area_where.replace' not in src
          print('tenant SQL fix checks passed')
          PY
      - name: Commit tested source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/open_close/collectors/seo_pages.py
          if ! git diff --cached --quiet; then
            git commit -m 'Harden tenant count query for city commercial analysis'
            git push origin HEAD:work/open-close-commercial-intel-20260916
          fi
