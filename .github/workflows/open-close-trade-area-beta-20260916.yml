name: Open Close Trade Area Beta
on:
  push:
    branches: [work/open-close-trade-area-beta-20260916]
    paths:
      - scripts/upgrade_open_close_trade_area_20260916.py
      - .github/workflows/open-close-trade-area-beta-20260916.yml
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply trade-area beta patch
        run: python scripts/upgrade_open_close_trade_area_20260916.py
      - name: Syntax and focused checks
        run: |
          python -m py_compile services/open_close/collectors/trade_area.py services/open_close/collectors/seo_pages.py
          python - <<'PY'
          from services.open_close.collectors.trade_area import compute_trade_area_score
          x=compute_trade_area_score(70,6,3,36,5)
          assert x['foot_traffic_connected'] is False
          assert x['rank'] in {'S','A','B','C','D'}
          assert 0 <= x['score'] <= 100
          y=compute_trade_area_score(70,6,3,36,5,foot_traffic_score=80)
          assert y['foot_traffic_connected'] is True
          src=open('services/open_close/collectors/seo_pages.py').read()
          assert '商圏ポテンシャル' in src
          assert '人流データ：未連携' in src
          assert '売上・利益・出店成功率を示すものではありません' in src
          assert 'PERCENTILE_CONT(0.5)' in src
          print('trade-area focused checks passed')
          PY
      - name: Commit tested source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/open_close/collectors/seo_pages.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add commercial-area potential beta to store detail pages'
            git push origin HEAD:work/open-close-trade-area-beta-20260916
          fi
