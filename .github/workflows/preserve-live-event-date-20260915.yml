name: Preserve live corporate event date 20260915
on:
  push:
    branches: [main]
    paths:
      - 'scripts/preserve_live_event_date_20260915.py'
      - '.github/workflows/preserve-live-event-date-20260915.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/preserve_live_event_date_20260915.py
      - run: python -m py_compile services/corporate/model.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/corporate/model.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve corporate proceeding dates on refresh'
          git push origin HEAD:main
