name: Rebalance Buzz Now SP ads
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rebalance_buzznow_sp_ads_20260916.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebalance SP ads and remove Amazon placements
        run: python scripts/rebalance_buzznow_sp_ads_20260916.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/index.html templates/trend.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebalance Buzz Now SP ads and remove Amazon placements'
          git push origin HEAD:main
