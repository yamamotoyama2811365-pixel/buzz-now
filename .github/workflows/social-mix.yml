# X-only news policy applied: 2026-09-12.
name: Social content mix verification
on:
  push:
    branches: [feat/social-mix-20260911, main]
    paths: [app/**, tests/test_social_mix.py, tests/test_social_schedule.py, scripts/install_social_mix.py, .github/workflows/social-mix.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python scripts/install_social_mix.py
      - run: python -m unittest discover -s tests -p test_social_mix.py -v
      - run: python -m unittest discover -s tests -p test_social_schedule.py -v
      - run: python -m unittest discover -s tests -p test_visitor_analytics.py -v
      - run: python -m unittest discover -s tests -p test_shared_api.py -v
      - run: python -m unittest discover -s tests -p test_traffic_retention.py -v
      - run: python -m compileall -q app services
      - run: git diff --check
  assemble-feature-only:
    if: github.ref == 'refs/heads/feat/social-mix-20260911'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python scripts/install_social_mix.py
      - name: Commit only the verified integration to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/social_schedule.py app/detective_posts.py
          if ! git diff --cached --quiet; then
            git commit -m 'Wire per-platform 8:2 detective content rotation'
            git push origin HEAD:feat/social-mix-20260911
          fi
  production-read-only-check:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read production policy only; never trigger a social post
        run: |
          python - <<'PY'
          import json,time
          from urllib.request import urlopen
          from urllib.error import HTTPError,URLError
          url='https://buzz-now-1.onrender.com/api/social/schedule'
          for attempt in range(30):
              try:
                  with urlopen(url,timeout=10) as response: data=json.load(response)
                  policy=data.get('mix_policy',{})
                  if policy.get('version')==3:
                      assert policy['platforms']['x']['character_positions']==[]
                      assert policy['platforms']['threads']['character_positions']==[5,10]
                      assert set(policy['platforms'])=={'x','threads'}
                      print(json.dumps(data,ensure_ascii=False,indent=2))
                      break
              except (HTTPError,URLError,TimeoutError,ValueError,AssertionError,KeyError):
                  pass
              time.sleep(10)
          else: raise SystemExit('Production v3 per-platform mix policy not verified')
          PY
