name: Traffic retention verification
on:
  push:
    branches: [feat/traffic-retention, main]
    paths: [app/traffic_retention.py, tests/test_traffic_retention.py, .github/workflows/traffic-retention-tests.yml]
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retention_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests -p test_traffic_retention.py -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retention_test
      - run: python -m py_compile app/main.py app/traffic_retention.py
