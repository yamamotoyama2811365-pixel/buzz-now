name: Install X i-mobile legacy gate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_x_imobile_legacy_gate.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: x-imobile-legacy-gate
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install legacy X gate
        run: python3 scripts/install_x_imobile_legacy_gate.py
      - name: Validate Python
        run: python3 -m py_compile app/migration_control.py
      - name: Commit generated change
        run: |
          if git diff --quiet -- app/migration_control.py; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/migration_control.py
          git commit -m 'Route X traffic through approved legacy i-mobile gate'
          git push
