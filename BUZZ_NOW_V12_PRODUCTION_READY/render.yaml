services:
  - type: web
    name: buzz-now
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: APP_VERSION
        value: 12.0.0
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: "false"
      - key: REAL_DATA_MODE
        value: "true"
      - key: REAL_DATA_INTERVAL_MINUTES
        value: "30"
      - key: SITE_URL
        sync: false
      - key: SITE_NAME
        value: BUZZ NOW
      - key: ADSENSE_ENABLED
        value: "false"
      - key: AFFILIATE_ENABLED
        value: "false"
