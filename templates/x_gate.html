<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ site_name }}｜記事を表示します</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#07090d;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .gate{width:min(100%,520px);text-align:center}
    .brand{font-size:13px;letter-spacing:.18em;font-weight:800;opacity:.7;margin-bottom:22px}
    h1{font-size:24px;line-height:1.45;margin:0 0 10px}
    .lead{font-size:14px;line-height:1.8;opacity:.76;margin:0 auto 22px;max-width:430px}
    .adbox{min-height:180px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
    .adlabel{font-size:10px;letter-spacing:.12em;opacity:.42;margin:10px 0 8px}
    .continue{width:100%;margin-top:18px;border:0;border-radius:14px;padding:16px 18px;font-weight:800;font-size:15px;background:#f5f7fb;color:#080a0e;cursor:pointer}
    .continue:disabled{opacity:.35;cursor:default}
    .note{font-size:11px;line-height:1.65;opacity:.5;margin-top:12px}
  </style>
{% include "_site_icons.html" %}
</head>
<body>
  <main class="gate">
    <div class="brand">BUZZ NOW</div>
    <h1>メディア運営にご協力をお願いします</h1>
    <p class="lead">
      BUZZ NOWは、話題の兆候を自動収集・分析して無料で公開しています。<br>
      広告をご覧いただくことで、メディア運営の継続にご協力いただけます。
    </p>

    <div class="adlabel">ADVERTISEMENT</div>
    <div class="adbox">
      {{ imobile_ad_html | safe }}
    </div>

    <button id="continueBtn" class="continue" disabled>
      あと {{ gate_seconds }} 秒で記事を表示
    </button>

    <p class="note">
      広告をクリックする必要はありません。待ち時間のあと、そのまま記事へ進めます。
    </p>
  </main>

  <script>
    (() => {
      const btn = document.getElementById('continueBtn');
      const detailUrl = {{ detail_url | tojson }};
      let remain = Number({{ gate_seconds | int }});

      const openArticle = () => { window.location.href = detailUrl; };

      if (remain <= 0) {
        btn.disabled = false;
        btn.textContent = '記事を見る →';
      } else {
        const timer = setInterval(() => {
          remain -= 1;
          if (remain <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = '記事を見る →';
          } else {
            btn.textContent = `あと ${remain} 秒で記事を表示`;
          }
        }, 1000);
      }

      btn.addEventListener('click', openArticle);
    })();
  </script>
</body>
</html>
